<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Create your DumiduUddipana account."
  >

  <title>Create Account | DumiduUddipana</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- Favicon / App icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="/manifest.json">
</head>


<body>

<div class="auth-page">

  <div class="auth-box">


    <!-- LOGO -->

    <a
      href="index.html"
      class="logo"
    >

      <span class="logo-box">
        DU
      </span>

      <span>
        DumiduUddipana
      </span>

    </a>


    <!-- TITLE -->

    <h1>
      Create your account
    </h1>


    <p>
      Create an account to start learning.
    </p>


    <!-- REGISTER FORM -->

    <form
      id="registerForm"
    >


      <!-- NAME -->

      <label for="name">
        Full Name
      </label>

      <input
        type="text"
        id="name"
        placeholder="Your name"
        autocomplete="name"
        required
      >


      <!-- EMAIL -->

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >


      <!-- PASSWORD -->

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="8"
        autocomplete="new-password"
        required
      >


      <!-- CONFIRM PASSWORD -->

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="8"
        autocomplete="new-password"
        required
      >


      <!-- BUTTON -->

      <button
        type="submit"
        class="btn primary"
      >

        Create Account

      </button>


    </form>


    <!-- MESSAGE -->

    <p
      id="registerMessage"
      aria-live="polite"
    ></p>


    <!-- ==================================
         GOOGLE SIGN IN
         ================================== -->

    <button
      type="button"
      id="googleRegisterButton"
      class="btn"
      style="background:#fff;color:#1f2937;border:1px solid #d1d5db;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;"
      onclick="signInWithGoogle(this)"
    >

      <img
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        alt=""
        width="18"
        height="18"
      >

      <span>
        Continue with Google
      </span>

    </button>


    <!-- LOGIN -->

    <p>

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </p>


    <!-- HOME -->

    <p>

      <a href="index.html">
        ← Back to Home
      </a>

    </p>


  </div>

</div>


<!-- SUPABASE -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- YOUR JAVASCRIPT -->

<script src="script.js"></script>


</body>

</html>
